# Gateway routing configuration
# Single source of truth for routes and service configuration

routes:
  # Product service - single instance
  - path: /api/products
    service:
      name: product-service
      module: services.product-service.main:app
      port: 8001
      replicas: 1
    auth_required: false

  # User service - load balanced with 3 replicas
  - path: /api/users
    service:
      name: user-service
      module: services.user-service.main:app
      port: 8002
      replicas: 3  # Generates instances on ports 8002, 8012, 8022
    auth_required: true

  # User by ID - parameter match
  - path: /api/users/:id
    service:
      name: user-service
      module: services.user-service.main:app
      port: 8002
      replicas: 3
    auth_required: true

  # User profile - prefix match
  - path: /api/users/:id/*
    service:
      name: user-service
      module: services.user-service.main:app
      port: 8002
      replicas: 3
    auth_required: true

  # Order service - single instance
  - path: /api/orders
    service:
      name: order-service
      module: services.order-service.main:app
      port: 8003
      replicas: 1
    auth_required: true
