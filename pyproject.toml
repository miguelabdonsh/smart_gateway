[project]
name = "smart-gateway"
version = "0.1.0"
description = "Lightweight, configurable API Gateway for microservices with intelligent routing, centralized auth, load balancing, payload transformation, rate limiting, and monitoring."
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastapi==0.120.0",
    "uvicorn[standard]==0.37.0",
    "pydantic==2.12.0",
    "httpx==0.28.0",
    "faker>=37.5.0",
    "pyyaml>=6.0.2",
    "pyjwt>=2.10.1",
]
